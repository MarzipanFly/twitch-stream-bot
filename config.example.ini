[twitch]

# Twitch Developer Console -> Applications -> Manage -> Client ID
# https://dev.twitch.tv/console/apps
client_id=

# Секрет приложения. Никому не отправляй и не публикуй.
# Для текущего Device Code Flow обычно не требуется.
client_secret=

# Оставляй пустыми: OAuth-токены бот хранит отдельно
# в data/twitch_tokens.dat через Windows DPAPI.
access_token=
refresh_token=

broadcaster_login=aleg_opelsin1
broadcaster_id=

# Заполняются автоматически из OAuth-токена.
bot_login=
bot_user_id=

[telegram]

# Секретный токен Telegram-бота.
bot_token=

# ID канала/чата для Bot API.
chat_id=

# Публичная ссылка для Twitch-команды !тг.
channel_url=https://t.me/your_channel

[discord]
# Twitch-команда !дс и автоматическое приглашение в чат.
invite_url=https://discord.gg/your_server

[promo]
# Автоматически отправлять ссылки Telegram и Discord в Twitch-чате.
# Работает только во время трансляции, если бот подключён к EventSub.
enabled=true
# Случайный интервал, в минутах (от 1 до 60).
min_minutes=5
max_minutes=10

[stream_report]
# Автоматический локальный журнал каждого стрима и отчёт при завершении.
# Без дополнительных OAuth scopes, OBS и ИИ.
enabled=true

[dashboard]
# Локальная панель только на http://127.0.0.1:8765
enabled=true
port=8765

[bot]
command_prefix=!

[obs]
# OBS Studio 28+ -> Tools -> WebSocket Server Settings
# Local OBS WebSocket v5 at 127.0.0.1:4455.
# Keep real password only in ignored config.ini.
enabled=false
password=

[category_sync]
# Set true to sync Twitch category with OBS scenes.
# Category detection uses the active Windows window, not a game-specific process.
# The scene names must exactly match OBS.
enabled=false
chat_scene=Общение
game_scene=Игры
# Legacy compatibility option; category detection now uses the active Windows window.
game_input=Захват игры
chat_category=Just Chatting
# Poll interval in seconds (2..60).
poll_seconds=5

[obs_director]
# Automatically switch only between the configured game/chat scenes.
# Leave disabled until you have tested it locally.
enabled=false
auto_game_scene=true
auto_chat_scene=true
game_scene=Игры
chat_scene=Общение
break_scene=Перерыв
game_input=Захват игры
# Require the process to remain present/absent for these durations.
game_start_delay_seconds=10
game_stop_delay_seconds=20
# Manual scene selection temporarily pauses automatic switching.
manual_override_seconds=120
poll_seconds=3

[ai]
# Ollama must be running locally at http://127.0.0.1:11434.
# Run: ollama pull qwen3:4b-instruct
# Create your model "apelsinbot" separately (see README).
# Switch to true to enable chat command: !бот <question>
enabled=false
model=apelsinbot
# Semantic search requires: ollama pull qwen3-embedding:0.6b
# Off by default to avoid extra GPU and network/API overhead.
semantic_enabled=false
semantic_model=qwen3-embedding:0.6b
# Per-viewer cooldown: 5..300 seconds
cooldown_seconds=30

[cooldowns]
# Глобальные персонифицированные задержки в секундах.
normal_seconds=10
game_seconds=5
bruh_seconds=15
