[twitch]

# Twitch Developer Console -> Applications -> Manage -> Client ID
# https://dev.twitch.tv/console/apps
client_id=

# Секрет приложения. Никому не отправляй и не публикуй.
# Для текущего Device Code Flow обычно не требуется.
client_secret=

# Оставляй пустыми: OAuth-токены бот хранит отдельно
# в data/twitch_tokens.dat через Windows DPAPI.
access_token=
refresh_token=

broadcaster_login=aleg_opelsin1
broadcaster_id=

# Заполняются автоматически из OAuth-токена.
bot_login=
bot_user_id=

[telegram]

# Секретный токен Telegram-бота.
bot_token=

# ID канала/чата для Bot API.
chat_id=

# Публичная ссылка для Twitch-команды !тг.
channel_url=https://t.me/your_channel

[discord]
# Twitch-команда !дс и автоматическое приглашение в чат.
invite_url=https://discord.gg/your_server

[promo]
# Автоматически отправлять ссылки Telegram и Discord в Twitch-чате.
# Работает только во время трансляции, если бот подключён к EventSub.
enabled=true
# Случайный интервал, в минутах (от 1 до 60).
min_minutes=5
max_minutes=10

[raids]
# Send Twitch's native Shoutout card automatically when another channel raids this channel.
# Requires the bot account to be a channel moderator and a fresh OAuth grant with moderator:manage:shoutouts.
auto_shoutout=false

[stream_report]
# Автоматический локальный журнал каждого стрима и отчёт при завершении.
# Без дополнительных OAuth scopes, OBS и ИИ.
enabled=true

[channel_points]
# Receives custom Channel Points reward redemptions for the broadcaster account.
# Requires a separate broadcaster OAuth approval for channel:read:redemptions.
# Keep disabled until you enable it and complete the device-code authorization.
enabled=false
# Post a short confirmation in the Twitch chat when a reward is redeemed.
announce_redemptions=true

[dashboard]
# Локальная панель только на http://127.0.0.1:8765
enabled=true
port=8765

[bot]
command_prefix=!

[obs]
# OBS Studio 28+ -> Tools -> WebSocket Server Settings
# Local OBS WebSocket v5 at 127.0.0.1:4455.
# Keep real password only in ignored config.ini.
enabled=false
password=

[category_sync]
# Set true to sync Twitch category with OBS scenes.
# Detects fullscreen Windows applications; no per-game executable or OBS source is required.
# The scene names must exactly match OBS.
enabled=false
chat_scene=Общение
game_scene=Игры
# Legacy compatibility setting; fullscreen detection does not require this source.
game_input=Захват игры
chat_category=Just Chatting
# Poll interval in seconds (2..60).
poll_seconds=5

[obs_director]
# Automatically switch between game/chat scenes based on fullscreen Windows applications.
# No specific Game Capture source is required. Leave disabled until tested locally.
enabled=false
auto_game_scene=true
auto_chat_scene=true
game_scene=Игры
chat_scene=Общение
break_scene=Перерыв
# Legacy compatibility setting; ignored by the fullscreen detector.
game_input=Захват игры
# Require a fullscreen application to remain present/absent for these durations.
game_start_delay_seconds=10
game_stop_delay_seconds=20
# Manual scene selection temporarily pauses automatic switching.
manual_override_seconds=120
poll_seconds=3

[cooldowns]
# Глобальные персонифицированные задержки в секундах.
normal_seconds=10
game_seconds=5
bruh_seconds=15
