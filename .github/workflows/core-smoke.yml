name: ApelsinBot core smoke tests
on:
  push:
    branches:
      - refactor/remove-local-ollama-ai
      - feature/apelsin-natural-conversation
  pull_request:
    paths:
      - "src/**"
      - "include/**"
      - "dashboard/**"
      - "tests/**"
      - "twitchbot.pro"
      - ".github/workflows/core-smoke.yml"
jobs:
  eventsub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build EventSub replay guard tests
        run: cc -std=c11 -Wall -Wextra -Werror -Iinclude tests/test_eventsub_dedupe.c src/eventsub_dedupe.c -o test_eventsub_dedupe
      - name: Check replay guard
        run: ./test_eventsub_dedupe
      - name: Build strict metadata and reconnect URL parsing tests
        run: cc -std=c11 -Wall -Wextra -Werror -Iinclude -Ithird_party/cjson tests/test_eventsub_id.c src/twitch_eventsub.c third_party/cjson/cJSON.c -lm -o test_eventsub_id
      - name: Check EventSub parsing
        run: ./test_eventsub_id

  windows-syntax:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Compile Windows bot and dashboard modules (no link)
        shell: cmd
        run: |
          for /f "usebackq delims=" %%p in (`"%ProgramFiles(x86)%\\Microsoft Visual Studio\\Installer\\vswhere.exe" -latest -products * -property installationPath`) do set "VS_DIR=%%p"
          call "%VS_DIR%\\Common7\\Tools\\VsDevCmd.bat" -arch=x64
          cl /nologo /W3 /TC /std:c11 /Iinclude /Ithird_party/cjson /c src\\app.c src\\config.c src\\channel_points.c src\\token_store.c src\\dashboard_server.c src\\dashboard_settings.c src\\twitch_eventsub.c src\\twitch_eventsub_ws.c src\\eventsub_dedupe.c src\\main.c
      - name: Compile and exercise local dashboard (Windows)
        shell: cmd
        run: |
          for /f "usebackq delims=" %%p in (`"%ProgramFiles(x86)%\\Microsoft Visual Studio\\Installer\\vswhere.exe" -latest -products * -property installationPath`) do set "VS_DIR=%%p"
          call "%VS_DIR%\\Common7\\Tools\\VsDevCmd.bat" -arch=x64
          cl /nologo /W3 /TC /std:c11 /Iinclude tests\\test_dashboard.c src\\dashboard_server.c src\\logger.c /Fe:test_dashboard.exe /link Ws2_32.lib
          test_dashboard.exe

