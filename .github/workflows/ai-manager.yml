name: AI Manager tests

on:
  push:
    branches:
      - feature/apelsin-natural-conversation
  pull_request:
    paths:
      - "include/ai_manager.h"
      - "include/ai_action.h"
      - "src/ai_manager.c"
      - "src/ai_action.c"
      - "tests/test_ai_manager.c"
      - "tests/test_ai_action.c"
      - "training/evaluation.jsonl"
      - "tests/eval_dashboard_ai.py"
      - "twitchbot.pro"
      - ".github/workflows/ai-manager.yml"

jobs:
  ai-manager:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile with warnings as errors
        run: cc -std=c11 -Wall -Wextra -Werror -Iinclude tests/test_ai_manager.c src/ai_manager.c -o test_ai_manager
      - name: Run observe-only scenarios
        run: ./test_ai_manager
      - name: Compile Action Dispatcher with warnings as errors
        run: cc -std=c11 -Wall -Wextra -Werror -Iinclude tests/test_ai_action.c src/ai_action.c -o test_ai_action
      - name: Run Action Dispatcher dry-run guards
        run: ./test_ai_action
      - name: Validate evaluation scenario syntax without calling Ollama
        run: python3 tests/eval_dashboard_ai.py --list --prefix persona_ --limit 0

